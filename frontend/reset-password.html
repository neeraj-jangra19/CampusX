<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus X — Reset Password</title>

    <link rel="stylesheet" href="forgot-password.css">
</head>

<body>

    <div class="overlay"></div>

    <div class="forgot-container">

        <!-- Logo -->
        <div class="logo-container">
            <img src="CampusX_logo.png" alt="Campus X Logo">
        </div>

        <div class="forgot-card">

            <h1>Set a New Password</h1>

            <p class="subtitle">Choose a new password for your Campus X account.</p>

            <form id="resetForm">

                <div class="input-group"><label for="password">New Password</label><input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required></div><div class="input-group"><label for="confirm">Confirm Password</label><input type="password" id="confirm" placeholder="Re-enter password" autocomplete="new-password" required></div>

                <button type="submit" class="reset-btn">
                    Update Password
                </button>

                <p id="message"></p>

            </form>

            <div class="back-login">
                <span>Remember your password?</span>
                <a href="login.html">Back to Login</a>
            </div>

        </div>

    </div>

    <script src="api.js"></script>
<script src="reset-password.js"></script>

</body>
</html>
