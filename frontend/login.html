<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campus X | Login</title>


    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>


<div class="login-page">

    <div class="background"></div>

    <div class="overlay"></div>

    <div class="shape shape-one"></div>

    <div class="shape shape-two"></div>
    <main class="login-container">

        <div class="brand">
            <img
                src="CampusX_logo.png"
                alt="Campus X"
                class="campusx-logo"
            >


            <!-- TAGLINE -->
            <div class="tagline">
                Meet. Connect. Belong.
            </div>

        </div>



        <!-- ======================================
             TOP RIGHT HANDWRITTEN NOTE
        ======================================= -->

        <div class="top-note">

            <span>Same</span>

            <span>Campus.</span>

            <span>New</span>

            <span>Connections.</span>

            <div class="top-heart">
                ♡
            </div>

        </div>



        <!-- ======================================
             LOGIN CONTENT
        ======================================= -->

        <section class="login-content">


            <!-- HEADING -->

            <h1>
                Welcome back,<br>
                Campus Explorer
            </h1>


            <!-- PURPLE LINE -->

            <div class="heading-line"></div>


            <!-- DESCRIPTION -->

            <p class="description">

                Log in to continue your journey<br>
                on Campus X.

            </p>



            <!-- ==================================
                 LOGIN FORM
            =================================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">


                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            ></rect>

                            <path
                                d="M3 7l9 6 9-6"
                            ></path>

                        </svg>

                    </div>


                    <input
                        type="text"
                        id="email"
                        placeholder="Email or College ID"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">


                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                            <circle
                                cx="12"
                                cy="15"
                                r="1"
                            ></circle>

                        </svg>

                    </div>


                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >


                    <!-- PASSWORD VISIBILITY -->

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                    >

                        <svg
                            id="eyeIcon"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M2 12s3.5-7 10-7
                                   10 7 10 7
                                   -3.5 7-10 7
                                   S2 12 2 12z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>



                <!-- ==================================
                     REMEMBER / FORGOT
                =================================== -->

                <div class="login-options">


                    <label class="remember">


                        <input
                            type="checkbox"
                            id="remember"
                        >


                        <span class="custom-checkbox">
                            ✓
                        </span>


                        <span>
                            Remember me
                        </span>


                    </label>



                    <a
                        href="forgot-password.html"
                        class="forgot-password"
                    >
                        Forgot password?
                    </a>


                </div>



                <!-- ==================================
                     LOGIN BUTTON
                =================================== -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    <span>
                        Log In
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </button>


            </form>

            <div class="signup-text">

                <span>
                    Don’t have an account?
                </span>

                <a href="signup.html">
                    Sign Up
                </a>

            </div>


        </section>


    </main>

</div>


<!-- LOGIN JS -->

<script src="api.js"></script>
<script src="login.js"></script>


</body>

</html>
