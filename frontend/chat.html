<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus X — Chat</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="chat-ui.css">
</head>
<body>
  <main class="chat-app">
    <header class="chat-top">
      <button onclick="location.href='dashboard.html#chat'">‹</button>
      <div><strong id="name">Chat</strong><span id="status">Campus X match</span></div>
    </header>
    <div id="messages" class="messages"></div>
    <form id="form">
      <input id="input" placeholder="Write a message..." autocomplete="off">
      <button>➤</button>
    </form>
  </main>
  <script src="api.js"></script>
<script src="chat-ui.js"></script>
<script src="chat.js"></script>
</body>
</html>
