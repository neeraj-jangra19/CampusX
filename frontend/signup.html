<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campus X | Sign Up</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="signup.css"
    >

</head>


<body>


<div class="signup-page">

    <div class="background"></div>

    <div class="dark-overlay"></div>

    <div class="purple-shape shape-1"></div>

    <div class="purple-shape shape-2"></div>

    <main class="signup-container">

        <div class="brand">

            <img
                src="CampusX_logo.png"
                alt="Campus X"
                class="campusx-logo"
            >

            <div class="tagline">
                Meet. Connect. Belong.
            </div>

        </div>

        <div class="top-note">

            <span>Same</span>

            <span>Campus.</span>

            <span>New</span>

            <span>Connections.</span>

            <span class="heart">
                ♡
            </span>

        </div>

        <section class="signup-content">

            <h1>
                Create your<br>
                Campus X account
            </h1>

            <div class="heading-line"></div>
            <p class="description">
                Join a community that feels<br>
                like home.
            </p>

            <form id="signupForm">
                <div class="input-box">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <circle
                                cx="12"
                                cy="8"
                                r="4">
                            </circle>

                            <path
                                d="M4 21c0-4
                                   3.5-7
                                   8-7s8 3
                                   8 7">
                            </path>

                        </svg>

                    </div>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        autocomplete="name"
                        required
                    >

                </div>
                <div class="input-box">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2">
                            </rect>

                            <path
                                d="M3 7l9 6
                                   9-6">
                            </path>

                        </svg>

                    </div>

                    <input
                        type="text"
                        id="email"
                        placeholder="Email or College ID"
                        autocomplete="username"
                        required
                    >

                </div>
                <div class="input-box">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2">
                            </rect>

                            <path
                                d="M8 10V7
                                   a4 4 0
                                   0 1 8 0v3">
                            </path>

                            <circle
                                cx="12"
                                cy="15"
                                r="1">
                            </circle>

                        </svg>

                    </div>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        id="passwordToggle"
                    >

                        <svg
                            id="passwordEye"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M2 12s3.5-7 10-7
                                   10 7 10 7
                                   -3.5 7-10 7
                                   S2 12 2 12z">
                            </path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3">
                            </circle>

                        </svg>

                    </button>

                </div>
                <div class="input-box">

                    <div class="input-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="11"
                                rx="2">
                            </rect>

                            <path
                                d="M8 10V7
                                   a4 4 0
                                   0 1 8 0v3">
                            </path>

                            <circle
                                cx="12"
                                cy="15"
                                r="1">
                            </circle>

                        </svg>

                    </div>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        id="confirmPasswordToggle"
                    >

                        <svg
                            id="confirmPasswordEye"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M2 12s3.5-7 10-7
                                   10 7 10 7
                                   -3.5 7-10 7
                                   S2 12 2 12z">
                            </path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3">
                            </circle>

                        </svg>

                    </button>

                </div>
                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                    >

                    <span class="checkbox">
                        ✓
                    </span>


                    <span class="terms-text">

                        I agree to the
                        <a href="terms.html">
                            Terms &amp; Conditions
                        </a>

                        <br>

                        and
                        <a href="privacy.html">
                            Privacy Policy
                        </a>

                    </span>

                </label>
                <button
                    type="submit"
                    class="signup-button"
                >

                    <span>
                        Sign Up
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </button>


            </form>
            <div class="or-divider">

                <span></span>

                <strong>
                    OR
                </strong>

                <span></span>

            </div>
            <div class="login-link">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Log In
                </a>

            </div>

        </section>
    </main>

</div>

<script src="api.js"></script>
<script src="signup.js"></script>

</body>

</html>
